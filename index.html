<!DOCTYPE html>
<html>
  <head>
    <title>Holding Ground</title>
    <style>
      body {
        font-family: sans-serif;
        background-colour: #F6F4EE;
        color: #1B211C;
        padding: 20px;
      }
      h1 {
        color: #2F6F4E;
      }
    </style>
  </head>
  <body>
    <h1>Holding Ground</h1>
    <p>Track how your holdings could grow over time</p>
    <button id="testButton">Click me</button>
    <P id="output"></P>

    <script>
      const button = document.getElementById("testButton");
      const output = document.getElementById("output");

      button.addEventListener("click",function() {
        output.textContent = "You clicked the button!";
      });
    </script>
  </body>
</html>
