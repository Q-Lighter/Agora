<!DOCTYPE html>
<html>
  <head>
    <title>Holding Ground</title>
    <style>
      body {
        font-family: sans-serif;
        background-colour: #F6F4EE;
        color: #1B211C;
        padding: 20px;
      }
      h1 {
        color: #2F6F4E;
      }
    </style>
  </head>
  <body>
    <h1>Holding Ground</h1>
    <p>Track how your holdings could grow over time</p>
    <input type="text" id="nameInput" placeholder="Enter a stock name">
    <button id="testButton">Add it</button>
    <div id="stockList"></div>

  <script>
  const input = document.getElementById("nameInput");
  const button = document.getElementById("testButton");
  const stockList = document.getElementById("stockList");

  const stocks = [];

  function renderStocks() {
    stockList.innerHTML = stocks.map(function(stock) {
      return "<p style='color:" + stock.color + "'>" + stock.name + "</p>";
    }).join("");
  }

  button.addEventListener("click", function() {
    const stockName = input.value;
    const newStock = { name: stockName, color: "#2F6F4E", price: 100 };
    stocks.push(newStock);
    renderStocks();
    input.value = "";
  });
</script>

  </body>
</html>
