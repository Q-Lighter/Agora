<!DOCTYPE html>
<html>
  <head>
    <title>Holding Ground</title>
    <style>
      body {
        font-family: sans-serif;
        background-colour: #F6F4EE;
        color: #1B211C;
        padding: 20px;
      }
      h1 {
        color: #2F6F4E;
      }
    </style>
  </head>
  <body>
    <h1>Holding Ground</h1>
    <p>Track how your holdings could grow over time</p>
    <input type="text" id="nameInput" placeholder="Enter a stock name">
    <button id="testButton">Add it</button>
    <p id="output"></p>

   <script>
     const input = document.getElementById("nameInput");
     const button = document.getElementById("testButton");
     const output = document.getElementById("output");

     const stocks = [];

     button.addEventListener("click", function() {
       const stockName = input.value;
       stocks.push(stockName);
       output.textContent = "Your stocks: " + stocks.join(", ");
       input.value = "";
     });
</script>

  </body>
</html>
